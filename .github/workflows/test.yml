name: Install and test spmx

on:
  push:
    branches: [main]
    paths: ["Formula/spmx.rb", ".github/workflows/test.yml"]
  pull_request:
    paths: ["Formula/spmx.rb", ".github/workflows/test.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Homebrew (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the formula from this checkout
        run: |
          brew tap macitch/spmx "$GITHUB_WORKSPACE"
          brew install macitch/spmx/spmx
          brew test macitch/spmx/spmx
          expected_version="$(brew info --json=v2 macitch/spmx/spmx | jq -r '.formulae[0].versions.stable')"
          test "$(spmx --version)" = "$expected_version"
          lipo -archs "$(brew --prefix macitch/spmx/spmx)/bin/spmx"
      - name: Inspect a local dependency with the installed executable
        run: |
          mkdir -p "$RUNNER_TEMP/spmx-smoke/Root" "$RUNNER_TEMP/spmx-smoke/Leaf"
          cat > "$RUNNER_TEMP/spmx-smoke/Leaf/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.0
          import PackageDescription
          let package = Package(name: "Leaf")
          SWIFT
          cat > "$RUNNER_TEMP/spmx-smoke/Root/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.0
          import PackageDescription
          let package = Package(name: "Root", dependencies: [.package(path: "../Leaf")])
          SWIFT
          spmx why leaf --path "$RUNNER_TEMP/spmx-smoke/Root" --json > "$RUNNER_TEMP/spmx-smoke/graph.json"
          jq -e '.paths == [["root", "leaf"]] and .hadMissingManifests == false' "$RUNNER_TEMP/spmx-smoke/graph.json"
